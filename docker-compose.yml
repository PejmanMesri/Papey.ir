services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papey123}
      POSTGRES_DB: ${POSTGRES_DB:-papeydb}
    volumes:
      - papey_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-papey} -d $${POSTGRES_DB:-papeydb}"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    volumes:
      - papey_private_data:/app/App_Data
    depends_on:
      db:
        condition: service_healthy

volumes:
  papey_pgdata:
  papey_private_data:

